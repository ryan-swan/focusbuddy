# Electron-builder config for the Haptyx desktop app.
# Produces an unsigned macOS .zip + .dmg in `release/`.
# Notarization/signing left off for v1 — once we have an Apple
# Developer cert, add `mac.identity` + `mac.notarize` here.
appId: app.haptyx.desktop
productName: Haptyx
copyright: Copyright © 2026 Haptyx
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md}"
  - "!**/*.{ts,tsx,map}"

asarUnpack:
  # Native modules must live outside the asar archive so Node can load them.
  - node_modules/better-sqlite3/**/*
  - node_modules/node-mac-haptics/**/*

# GitHub Releases is the auto-update channel. Local `dist:zip` builds
# don't push (no --publish flag), so the local artifact is unchanged.
# A separate `dist:release` script pushes to GitHub when we're ready
# to roll out a version — at that point electron-updater on every
# installed copy sees the new release and offers it to the user.
publish:
  provider: github
  owner: saasmouth
  repo: focusbuddy
  releaseType: release

protocols:
  # macOS registers haptyx://... so the website can hand auth tokens
  # off to the desktop via a deep link.
  - name: Haptyx Protocol
    schemes:
      - haptyx
    role: Viewer

mac:
  category: public.app-category.productivity
  target:
    # v1: arm64 zip only. Most current Macs are Apple Silicon, the
    # zip is the smallest reliable artifact, and skipping dmg/x64
    # halves the build time. We add x64 + dmg back once notarisation
    # is set up.
    - target: zip
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  # electron-builder's `identity: "-"` does NOT do ad-hoc signing —
  # it tries to look up "-" as a keychain identity and silently skips
  # signing on failure. We force `identity: null` to skip its signing
  # path entirely, then `afterPack` runs codesign ourselves with the
  # ad-hoc identity (`--sign -`). See build/adhoc-sign.cjs for why.
  identity: null
  # macOS permission strings. Without these in Info.plist macOS
  # silently denies getUserMedia for camera + microphone — the user
  # never even sees the "Allow Haptyx to access…" system prompt.
  # NSCameraUsageDescription is what fixes the "camera doesn't
  # record" bug for the video-note widget.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Haptyx records voice notes that you choose to capture on your
      desk. Audio is processed locally (or sent to your configured
      transcription provider) and never proxied through Haptyx.
    NSCameraUsageDescription: >-
      Haptyx records video notes when you choose to capture them. Video
      and audio are stored locally and only transcribed via your
      configured provider.

# Post-pack hook — ad-hoc signs the .app so macOS Apple Silicon will
# execute it. Without this, downloaded zips show as "damaged and
# can't be opened" because the unsigned binary is rejected before
# Gatekeeper even runs.
afterPack: build/adhoc-sign.cjs

dmg:
  title: Haptyx ${version}
  iconSize: 96
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# Don't run the native-module rebuild step — we'll pre-rebuild
# better-sqlite3 + node-mac-haptics ourselves via `npm run rebuild`
# (the existing `electron-builder install-app-deps` shortcut). The
# in-builder rebuild was hanging on node-mac-haptics. The bindings
# already in node_modules/ are built for the right Electron version.
npmRebuild: false
